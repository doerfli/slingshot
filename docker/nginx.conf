# Static serving for the Slingshot SPA (stack §8): content-hashed assets cached hard,
# the HTML entry never cached, and a SPA fallback so any path resolves to index.html.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Basic hardening + sensible compression for the text bundle.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    server_tokens off;

    # Content-hashed build assets (dist/assets/index-<hash>.js|css): the filename changes
    # whenever the content does, so these are safe to cache immutably for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The HTML entry must never be cached, so a new deploy is picked up immediately
    # (it references the new hashed asset filenames).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths serve the app shell rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
